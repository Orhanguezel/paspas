<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Promats Lighthouse performans karşılaştırması</title>
  <desc id="desc">Ana sayfa ve Maximum ürün sayfasının mobil ve masaüstü performans puanları ile Largest Contentful Paint sürelerini karşılaştırır.</desc>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="64" y="62" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">Promats Lighthouse — mobil darboğazı</text>
  <text x="64" y="94" font-family="Arial, sans-serif" font-size="16" fill="#526079">11 Kasım 2026 · Lighthouse 12.8.2 · laboratuvar verisi</text>

  <rect x="48" y="125" width="540" height="455" rx="18" fill="#ffffff" stroke="#d9e2ef"/>
  <text x="76" y="168" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Performans puanı / 100</text>
  <line x1="225" y1="505" x2="540" y2="505" stroke="#9ca9bb" stroke-width="2"/>
  <line x1="225" y1="205" x2="225" y2="505" stroke="#9ca9bb" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#526079">
    <text x="199" y="510">0</text><text x="190" y="435">25</text><text x="190" y="360">50</text><text x="190" y="285">75</text><text x="181" y="210">100</text>
    <text x="89" y="252">Ana sayfa mobil</text><text x="75" y="327">Ana sayfa masaüstü</text>
    <text x="83" y="402">Ürün sayfası mobil</text><text x="69" y="477">Ürün sayfası masaüstü</text>
  </g>
  <g stroke="#edf1f6">
    <line x1="225" y1="430" x2="540" y2="430"/><line x1="225" y1="355" x2="540" y2="355"/><line x1="225" y1="280" x2="540" y2="280"/><line x1="225" y1="205" x2="540" y2="205"/>
  </g>
  <rect x="225" y="226" width="164" height="34" rx="6" fill="#d97706"/><text x="399" y="249" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">52</text>
  <rect x="225" y="301" width="252" height="34" rx="6" fill="#2563eb"/><text x="487" y="324" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">80</text>
  <rect x="225" y="376" width="164" height="34" rx="6" fill="#d97706"/><text x="399" y="399" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">52</text>
  <rect x="225" y="451" width="293" height="34" rx="6" fill="#2563eb"/><text x="528" y="474" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">93</text>

  <rect x="612" y="125" width="540" height="455" rx="18" fill="#ffffff" stroke="#d9e2ef"/>
  <text x="640" y="168" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Largest Contentful Paint</text>
  <text x="640" y="194" font-family="Arial, sans-serif" font-size="14" fill="#526079">Daha düşük daha iyi · 2,5 saniye hedef çizgisi</text>
  <line x1="785" y1="505" x2="1095" y2="505" stroke="#9ca9bb" stroke-width="2"/>
  <line x1="785" y1="205" x2="785" y2="505" stroke="#9ca9bb" stroke-width="2"/>
  <line x1="828" y1="205" x2="828" y2="505" stroke="#59667a" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="838" y="218" font-family="Arial, sans-serif" font-size="13" fill="#526079">2,5 sn</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#526079">
    <text x="649" y="252">Ana sayfa mobil</text><text x="635" y="327">Ana sayfa masaüstü</text>
    <text x="643" y="402">Ürün sayfası mobil</text><text x="629" y="477">Ürün sayfası masaüstü</text>
  </g>
  <rect x="785" y="226" width="293" height="34" rx="6" fill="#d97706"/><text x="1085" y="249" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">17,0 sn</text>
  <rect x="785" y="301" width="35" height="34" rx="6" fill="#2563eb"/><text x="830" y="324" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">2,1 sn</text>
  <rect x="785" y="376" width="147" height="34" rx="6" fill="#d97706"/><text x="942" y="399" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c2d12">8,6 sn</text>
  <rect x="785" y="451" width="25" height="34" rx="6" fill="#2563eb"/><text x="820" y="474" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">1,4 sn</text>

  <text x="64" y="617" font-family="Arial, sans-serif" font-size="14" fill="#526079">Ana sayfa mobil değerleri üç koşunun medyanıdır; ürün sayfası değerleri tek temsilî koşudur. CrUX alan verisi yoktur.</text>
</svg>
